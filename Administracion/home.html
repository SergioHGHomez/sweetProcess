<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://kit.fontawesome.com/cbd3f1ded0.js" crossorigin="anonymous"></script>
</head>
<body class="flex"></body>
    <div id="menu">
        <div id="menu-logo">
            <img src="/src/Logo/logo_simple.svg" alt="logo">
        </div>
        <p id="rol-name">Administrador</p>

        <div class="options">
            <a class="option option--active" href="home.html">
                <i class="fa-solid fa-house"></i>
                <p>Home</p>
            </a>
            <a class="option" href="usuarios.html">
                <i class="option-icon fa-solid fa-user"></i>
                <p class="option-text">Usuarios</p>
            </a>
            <a class="option" href="productos.html">
                <i class="option-icon fas fa-cookie-bite"></i>
                <p class="option-text">Catálogo</p>
            </a>
        </div>
        <div id="action-buttons">
            <a class="action-button" href="../nolimits-login/index.html">
                <i class="fa-solid fa-arrow-left-long"></i>
                <p>Cerrar Sesión</p>
            </a>
        </div>
    </div>
    <main class="width-100">
        <section>
            <div class="header flex space-between">
                <div class="header_left">
                    <p class="title-note">Buen dia</p>
                    <h1>Sofía Ramírez</h1>
                </div>
                <div class="header_right flex space-between">
                    <div>
                        <p class="bold">Sofía Ramírez</p>
                        <p>Administrador</p>
                    </div>
                    <div class="hearder_circle">
                        SR
                    </div>
                </div>
            </div>

            <div class="cards cards--grid">
                <div class="card card--board space-between align-center">
                    <div>
                        <i class="option-icon--medium option-icon--blue option-icon fa-solid fa-user"></i>
                        <span>
                            <div class="dashboard-card">
                                <p class="dashboard-card_name">5</p>
                            </div>
                            <p>Usuarios activos</p>
                        </span>
                    </div>

                </div>
                <div class="card card--board space-between align-center">
                    <div>
                        <i class="option-icon--medium option-icon--yellow option-icon fas fa-cookie-bite"></i>
                        <span>
                            <div class="product">
                                <p class="dashboard-card_name">8</p>
                            </div>
                            <p>Productos activos</p>
                        </span>
                    </div>

                </div>
                <div class="card card--board space-between align-center">
                    <div>
                        <i class="option-icon--medium option-icon--green option-icon fa-regular fa-clipboard"></i>
                        <span>
                            <div class="product">
                                <p class="dashboard-card_name">12</p>
                            </div>
                            <p>Pedidos hoy</p>
                        </span>
                    </div>

                </div>
            </div>
            <a class="button button--blue button--large flex space-between" href="usuarios.html" style="text-decoration:none;color:inherit;">
                <span>
                    <p class="bold">Ver usuarios</p>
                    <p class="thin-text">Gestiona el equipo y sus permisos</p>
                </span>
                <i class="option-icon--cream option-icon fa-solid fa-arrow-right-long"></i>
            </a>
        </section>
    </main>

</body>
</html>
