<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://kit.fontawesome.com/cbd3f1ded0.js" crossorigin="anonymous"></script>
    <script src="../Script.js"></script>
</head>
<style>
    .table-card{
        padding : 0px;
        overflow : hidden;
    }

    .product-table{
        width : 100%;
        border-collapse : collapse;
    }

    .product-table thead th{
        background-color : var(--surface-sunken);
        color : var(--text-secondary);
        text-transform : uppercase;
        font-size : 0.75rem;
        letter-spacing : 0.04em;
        text-align : left;
        padding : 16px 20px;
        font-weight : 700;
    }

    .product-table tbody td{
        padding : 14px 20px;
        border-top : 1px solid var(--border-default);
        vertical-align : middle;
    }

    .product-table tbody tr:hover{
        background-color : var(--surface-sunken);
    }

    .product-thumb{
        width : 48px;
        height : 48px;
        border-radius : 10px;
        border : 1px dashed var(--border-default);
        background-color : var(--surface-sunken);
        color : var(--text-muted);
        font-size : 0.65rem;
        text-align : center;
        display : flex;
        align-items : center;
        justify-content : center;
        line-height : 1.1;
        object-fit : cover;
    }

    .product-table .product-name{
        font-weight : 700;
        color : var(--text-primary);
    }

    .product-table .actions-cell{
        display : flex;
        align-items : center;
        gap : 16px;
    }

    .link-action{
        background : none;
        border : none;
        padding : 0px;
        cursor : pointer;
        font-weight : 600;
        font-size : 0.9rem;
    }

    .link-action--edit{
        color : var(--text-link);
    }

    .link-action--edit:hover{
        color : var(--text-link-hover);
    }

    .link-action--danger{
        color : var(--error);
    }

    .link-action--danger:hover{
        color : oklch(from var(--error) calc(l - 0.1) c h);
    }

    .product_status--active{
        background-color : var(--brand-accent);
        color : var(--neutral-900);
    }

    .product_status--inactive{
        background-color : var(--neutral-100);
        color : var(--text-muted);
    }

    .modal-overlay{
        display : none;
        position : fixed;
        inset : 0;
        background-color : oklch(0.2 0.02 55 / 0.5);
        align-items : center;
        justify-content : center;
        z-index : 100;
    }

    .modal-overlay.is-open{
        display : flex;
    }

    .modal-card{
        width : 100%;
        max-width : 420px;
        display : flex;
        flex-direction : column;
        gap : 16px;
    }

    .modal-card h2{
        margin : 0px;
    }

    .form-field{
        display : flex;
        flex-direction : column;
        gap : 6px;
    }

    .form-field label{
        font-size : 0.85rem;
        font-weight : 600;
        color : var(--text-secondary);
    }

    .form-field input,
    .form-field select{
        padding : 10px 12px;
        border-radius : 10px;
        border : 1px solid var(--border-default);
        font-family : var(--font-body);
        font-size : 0.95rem;
    }

    .modal-actions{
        display : flex;
        justify-content : flex-end;
        gap : 12px;
        margin-top : 8px;
    }

    .photo-picker{
        display : grid;
        grid-template-columns : repeat(4, 1fr);
        gap : 10px;
    }

    .photo-picker__item{
        padding : 0px;
        border-radius : 10px;
        border : 2px solid var(--border-default);
        background-color : var(--surface-sunken);
        cursor : pointer;
        overflow : hidden;
        aspect-ratio : 1;
        display : flex;
        align-items : center;
        justify-content : center;
        color : var(--text-muted);
        font-size : 0.7rem;
    }

    .photo-picker__item img{
        width : 100%;
        height : 100%;
        object-fit : cover;
    }

    .photo-picker__item.is-selected{
        border-color : var(--brand-primary);
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        cargaInicial();
        renderProductos();

        const modal = document.getElementById("edit-product-modal");
        const form = document.getElementById("edit-product-form");
        const modalTitle = document.getElementById("edit-product-title");
        const fotoInput = document.getElementById("edit-product-foto");
        const photoPicker = document.getElementById("edit-product-photo-picker");
        let modalMode = "editar";

        const IMAGENES_DISPONIBLES = [
            "src/productos/cheesecake-frutos-rojos.jpeg",
            "src/productos/cheesecake-maracumango-1.jpeg",
            "src/productos/cheesecake-maracumango-2.jpeg",
            "src/productos/postre-limon.jpeg",
            "src/productos/alfajores.jpg",
            "src/productos/Polvorones.jpg",
            "src/productos/cafe-de-la-olla.jpg",
            "src/productos/Champurrado.jpg"
        ];

        function renderGaleriaFotos(){
            let galeriaHTML = `<button type="button" class="photo-picker__item" data-src="">Ninguna</button>`;

            for (let i = 0; i < IMAGENES_DISPONIBLES.length; i++) {
                galeriaHTML += `<button type="button" class="photo-picker__item" data-src="${IMAGENES_DISPONIBLES[i]}"><img src="../${IMAGENES_DISPONIBLES[i]}" alt=""></button>`;
            }

            photoPicker.innerHTML = galeriaHTML;
        }

        function seleccionarFoto(ruta){
            fotoInput.value = ruta;
            photoPicker.querySelectorAll(".photo-picker__item").forEach(function(item) {
                item.classList.toggle("is-selected", item.dataset.src === ruta);
            });
        }

        photoPicker.addEventListener("click", function(event) {
            const item = event.target.closest(".photo-picker__item");
            if(!item) return;

            seleccionarFoto(item.dataset.src);
        });

        renderGaleriaFotos();

        function abrirModalEdicion(id){
            const producto = obtenerProductoPorId(id);
            if(!producto) return;

            modalMode = "editar";
            modalTitle.textContent = "Editar producto";
            document.getElementById("edit-product-id").value = producto.ProductoID;
            document.getElementById("edit-product-nombre").value = producto.Nombre;
            document.getElementById("edit-product-categoria").value = producto.Categoria;
            document.getElementById("edit-product-precio").value = producto.Precio;
            document.getElementById("edit-product-activo").value = producto.Activo ? "true" : "false";
            seleccionarFoto(producto.Foto || "");

            modal.classList.add("is-open");
        }

        function abrirModalCreacion(){
            modalMode = "agregar";
            modalTitle.textContent = "Agregar producto";
            form.reset();
            document.getElementById("edit-product-id").value = "";
            document.getElementById("edit-product-activo").value = "true";
            seleccionarFoto("");

            modal.classList.add("is-open");
        }

        function cerrarModalEdicion(){
            modal.classList.remove("is-open");
        }

        document.getElementById("admin-product__content").addEventListener("click", function(event) {
            const botonEditar = event.target.closest(".link-action--edit");
            if(botonEditar){
                abrirModalEdicion(botonEditar.dataset.id);
                return;
            }

            const botonEstado = event.target.closest(".link-action--danger");
            if(botonEstado){
                const producto = obtenerProductoPorId(botonEstado.dataset.id);
                if(!producto) return;

                actualizarProducto(producto.ProductoID, { Activo: !producto.Activo });
                renderProductos();
            }
        });

        document.getElementById("add-product-button").addEventListener("click", abrirModalCreacion);

        document.getElementById("edit-product-cancel").addEventListener("click", cerrarModalEdicion);

        modal.addEventListener("click", function(event) {
            if(event.target === modal) cerrarModalEdicion();
        });

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const datosProducto = {
                Nombre: document.getElementById("edit-product-nombre").value,
                Categoria: document.getElementById("edit-product-categoria").value,
                Precio: Number(document.getElementById("edit-product-precio").value),
                Activo: document.getElementById("edit-product-activo").value === "true",
                Foto: fotoInput.value
            };

            if(modalMode === "agregar"){
                agregarProducto(datosProducto);
            } else {
                const id = document.getElementById("edit-product-id").value;
                actualizarProducto(id, datosProducto);
            }

            cerrarModalEdicion();
            renderProductos();
        });
    });
</script>
<body class="flex"></body>
    <div id="menu">
        <div id="menu-logo">
            <img src="/src/Logo/logo_simple.svg" alt="logo">
        </div>
        <p id="rol-name">Administrador</p>

        <div class="options">
            <a class="option" href="home.html">
                <i class="fa-solid fa-house"></i>
                <p>Home</p>
            </a>
            <a class="option" href="usuarios.html">
                <i class="option-icon fa-solid fa-user"></i>
                <p class="option-text">Usuarios</p>
            </a>
            <a class="option option--active" href="productos.html">
                <i class="option-icon fas fa-cookie-bite"></i>
                <p class="option-text">Catálogo</p>
            </a>
        </div>
        <div id="action-buttons">
            <a class="action-button" href="../nolimits-login/index.html">
                <i class="fa-solid fa-arrow-left-long"></i>
                <p>Cerrar Sesión</p>
            </a>
        </div>
    </div>
    <main class="width-100">
        <section>
            <div class="header flex space-between center">
                <div class="header_left"> 
                    <h1>Catalogo</h1>
                </div>
                <div class="header_right flex space-between">
                    <button id="add-product-button" type="button" class="button button--slim button--blue">
                        <p>agregar producto</p>
                    </button>
                </div>
            </div>
            
            <div class="card table-card">
                <table id="admin-product" class="product-table">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product__content"></tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="edit-product-modal" class="modal-overlay">
        <form id="edit-product-form" class="card modal-card">
            <h2 id="edit-product-title">Editar producto</h2>
            <input type="hidden" id="edit-product-id">

            <div class="form-field">
                <label for="edit-product-nombre">Producto</label>
                <input type="text" id="edit-product-nombre" required>
            </div>

            <div class="form-field">
                <label for="edit-product-categoria">Categoría</label>
                <input type="text" id="edit-product-categoria" required>
            </div>

            <div class="form-field">
                <label for="edit-product-precio">Precio</label>
                <input type="number" id="edit-product-precio" min="0" required>
            </div>

            <div class="form-field">
                <label for="edit-product-activo">Estado</label>
                <select id="edit-product-activo">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>

            <div class="form-field">
                <label>Foto</label>
                <input type="hidden" id="edit-product-foto">
                <div id="edit-product-photo-picker" class="photo-picker"></div>
            </div>

            <div class="modal-actions">
                <button type="button" id="edit-product-cancel" class="button button--white">Cancelar</button>
                <button type="submit" class="button button--blue">Guardar</button>
            </div>
        </form>
    </div>

</body>
</html>
