<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://kit.fontawesome.com/cbd3f1ded0.js" crossorigin="anonymous"></script>
    <script src="../Script.js"></script>
</head>
<style>
    .table-card{
        padding : 0px;
        overflow : hidden;
    }

    .product-table{
        width : 100%;
        border-collapse : collapse;
    }

    .product-table thead th{
        background-color : var(--surface-sunken);
        color : var(--text-secondary);
        text-transform : uppercase;
        font-size : 0.75rem;
        letter-spacing : 0.04em;
        text-align : left;
        padding : 16px 20px;
        font-weight : 700;
    }

    .product-table tbody td{
        padding : 14px 20px;
        border-top : 1px solid var(--border-default);
        vertical-align : middle;
    }

    .product-table tbody tr:hover{
        background-color : var(--surface-sunken);
    }

    .product-thumb{
        width : 48px;
        height : 48px;
        border-radius : 10px;
        border : 1px dashed var(--border-default);
        background-color : var(--surface-sunken);
        color : var(--text-muted);
        font-size : 0.65rem;
        text-align : center;
        display : flex;
        align-items : center;
        justify-content : center;
        line-height : 1.1;
    }

    .product-table .product-name{
        font-weight : 700;
        color : var(--text-primary);
    }

    .product-table .actions-cell{
        display : flex;
        align-items : center;
        gap : 16px;
    }

    .link-action{
        background : none;
        border : none;
        padding : 0px;
        cursor : pointer;
        font-weight : 600;
        font-size : 0.9rem;
    }

    .link-action--edit{
        color : var(--text-link);
    }

    .link-action--edit:hover{
        color : var(--text-link-hover);
    }

    .link-action--danger{
        color : var(--error);
    }

    .link-action--danger:hover{
        color : oklch(from var(--error) calc(l - 0.1) c h);
    }

    .product_status--active{
        background-color : var(--brand-accent);
        color : var(--neutral-900);
    }

    .product_status--inactive{
        background-color : var(--neutral-100);
        color : var(--text-muted);
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        debugger;
    cargaInicial();
    renderProductos();
    });
</script>
<body class="flex"></body>
    <div id="menu">
        <div id="menu-logo">
            <img src="/src/Logo/logo_simple.svg" alt="logo">
        </div>
        <p id="rol-name">Administrador</p>

        <div class="options">
            <a class="option" href="home.html">
                <i class="fa-solid fa-house"></i>
                <p>Home</p>
            </a>
            <a class="option" href="usuarios.html">
                <i class="option-icon fa-solid fa-user"></i>
                <p class="option-text">Usuarios</p>
            </a>
            <a class="option option--active" href="productos.html">
                <i class="option-icon fas fa-cookie-bite"></i>
                <p class="option-text">Catálogo</p>
            </a>
        </div>
        <div id="action-buttons">
            <a class="action-button" href="../nolimits-login/index.html">
                <i class="fa-solid fa-arrow-left-long"></i>
                <p>Cerrar Sesión</p>
            </a>
        </div>
    </div>
    <main class="width-100">
        <section>
            <div class="header flex space-between center">
                <div class="header_left"> 
                    <h1>Catalogo</h1>
                </div>
                <div class="header_right flex space-between"> 
                    <button class="button button--slim button--blue">
                        <p>agregar producto</p> 
                    </button>
                </div>
            </div>
            
            <div class="card table-card">
                <table id="admin-product" class="product-table">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product__content"></tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    
</body>
</html>
