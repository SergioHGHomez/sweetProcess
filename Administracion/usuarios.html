<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://kit.fontawesome.com/cbd3f1ded0.js" crossorigin="anonymous"></script>
    <script src="../Script.js"></script>
</head>
<style>
    .table-card{
        padding : 0px;
        overflow : hidden;
    }

    .user-table{
        width : 100%;
        border-collapse : collapse;
    }

    .user-table thead th{
        background-color : var(--surface-sunken);
        color : var(--text-secondary);
        text-transform : uppercase;
        font-size : 0.75rem;
        letter-spacing : 0.04em;
        text-align : left;
        padding : 16px 20px;
        font-weight : 700;
    }

    .user-table tbody td{
        padding : 14px 20px;
        border-top : 1px solid var(--border-default);
        vertical-align : middle;
    }

    .user-table tbody tr:hover{
        background-color : var(--surface-sunken);
    }

    .user-table .user-name{
        font-weight : 700;
        color : var(--text-primary);
    }

    .user-table .actions-cell{
        display : flex;
        align-items : center;
        gap : 16px;
    }

    .link-action{
        background : none;
        border : none;
        padding : 0px;
        cursor : pointer;
        font-weight : 600;
        font-size : 0.9rem;
        text-align : left;
    }

    .link-action--edit,
    .link-action--reset{
        color : var(--text-link);
    }

    .link-action--edit:hover,
    .link-action--reset:hover{
        color : var(--text-link-hover);
    }

    .link-action--danger{
        color : var(--error);
    }

    .link-action--danger:hover{
        color : oklch(from var(--error) calc(l - 0.1) c h);
    }

    .user_status--active{
        background-color : var(--brand-accent);
        color : var(--neutral-900);
    }

    .user_status--inactive{
        background-color : var(--neutral-100);
        color : var(--text-muted);
    }

    .modal-overlay{
        display : none;
        position : fixed;
        inset : 0;
        background-color : oklch(0.2 0.02 55 / 0.5);
        align-items : center;
        justify-content : center;
        z-index : 100;
    }

    .modal-overlay.is-open{
        display : flex;
    }

    .modal-card{
        width : 100%;
        max-width : 420px;
        display : flex;
        flex-direction : column;
        gap : 16px;
    }

    .modal-card h2{
        margin : 0px;
    }

    .form-field{
        display : flex;
        flex-direction : column;
        gap : 6px;
    }

    .form-field label{
        font-size : 0.85rem;
        font-weight : 600;
        color : var(--text-secondary);
    }

    .form-field input,
    .form-field select{
        padding : 10px 12px;
        border-radius : 10px;
        border : 1px solid var(--border-default);
        font-family : var(--font-body);
        font-size : 0.95rem;
    }

    .modal-actions{
        display : flex;
        justify-content : flex-end;
        gap : 12px;
        margin-top : 8px;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        cargaInicialUsuarios();
        renderUsuarios();

        const modal = document.getElementById("edit-user-modal");
        const form = document.getElementById("edit-user-form");
        const modalTitle = document.getElementById("edit-user-title");
        let modalMode = "editar";

        function abrirModalEdicion(id){
            const usuario = obtenerUsuarioPorId(id);
            if(!usuario) return;

            modalMode = "editar";
            modalTitle.textContent = "Editar usuario";
            document.getElementById("edit-user-id").value = usuario.UsuarioID;
            document.getElementById("edit-user-nombre").value = usuario.Nombre;
            document.getElementById("edit-user-correo").value = usuario.Correo;
            document.getElementById("edit-user-rol").value = usuario.Rol;
            document.getElementById("edit-user-activo").value = usuario.Activo ? "true" : "false";
            document.getElementById("edit-user-contrasena").value = "";
            document.getElementById("edit-user-contrasena").required = false;
            document.getElementById("edit-user-contrasena").placeholder = "Dejar vacío para conservar la actual";

            modal.classList.add("is-open");
        }

        function abrirModalCreacion(){
            modalMode = "agregar";
            modalTitle.textContent = "Agregar usuario";
            form.reset();
            document.getElementById("edit-user-id").value = "";
            document.getElementById("edit-user-activo").value = "true";
            document.getElementById("edit-user-contrasena").value = CONTRASENA_POR_DEFECTO;
            document.getElementById("edit-user-contrasena").required = true;
            document.getElementById("edit-user-contrasena").placeholder = "";

            modal.classList.add("is-open");
        }

        function cerrarModal(){
            modal.classList.remove("is-open");
        }

        document.getElementById("admin-user__content").addEventListener("click", function(event) {
            const botonEditar = event.target.closest(".link-action--edit");
            if(botonEditar){
                abrirModalEdicion(botonEditar.dataset.id);
                return;
            }

            const botonReset = event.target.closest(".link-action--reset");
            if(botonReset){
                const usuario = obtenerUsuarioPorId(botonReset.dataset.id);
                if(usuario){
                    actualizarUsuario(usuario.UsuarioID, { Contrasena: CONTRASENA_POR_DEFECTO });
                    alert("La contraseña de " + usuario.Nombre + " se restableció a: " + CONTRASENA_POR_DEFECTO);
                }
                return;
            }

            const botonEstado = event.target.closest(".link-action--danger");
            if(botonEstado){
                const usuario = obtenerUsuarioPorId(botonEstado.dataset.id);
                if(!usuario) return;

                actualizarUsuario(usuario.UsuarioID, { Activo: !usuario.Activo });
                renderUsuarios();
            }
        });

        document.getElementById("add-user-button").addEventListener("click", abrirModalCreacion);

        document.getElementById("edit-user-cancel").addEventListener("click", cerrarModal);

        modal.addEventListener("click", function(event) {
            if(event.target === modal) cerrarModal();
        });

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const datosUsuario = {
                Nombre: document.getElementById("edit-user-nombre").value,
                Correo: document.getElementById("edit-user-correo").value,
                Rol: document.getElementById("edit-user-rol").value,
                Activo: document.getElementById("edit-user-activo").value === "true"
            };

            const contrasena = document.getElementById("edit-user-contrasena").value;
            if(contrasena) datosUsuario.Contrasena = contrasena;

            if(modalMode === "agregar"){
                agregarUsuario(datosUsuario);
            } else {
                actualizarUsuario(document.getElementById("edit-user-id").value, datosUsuario);
            }

            cerrarModal();
            renderUsuarios();
        });
    });
</script>
<body class="flex"></body>
    <div id="menu">
        <div id="menu-logo">
            <img src="/src/Logo/logo_simple.svg" alt="logo">
        </div>
        <p id="rol-name">Administrador</p>

        <div class="options">
            <a class="option" href="home.html">
                <i class="fa-solid fa-house"></i>
                <p>Home</p>
            </a>
            <a class="option option--active" href="usuarios.html">
                <i class="option-icon fa-solid fa-user"></i>
                <p class="option-text">Usuarios</p>
            </a>
            <a class="option" href="productos.html">
                <i class="option-icon fas fa-cookie-bite"></i>
                <p class="option-text">Catálogo</p>
            </a>
        </div>
        <div id="action-buttons">
            <a class="action-button" href="../nolimits-login/index.html">
                <i class="fa-solid fa-arrow-left-long"></i>
                <p>Cerrar Sesión</p>
            </a>
        </div>
    </div>
    <main class="width-100">
        <section>
            <div class="header flex space-between center">
                <div class="header_left">
                    <h1>Usuarios</h1>
                </div>
                <div class="header_right flex space-between">
                    <button id="add-user-button" type="button" class="button button--slim button--blue">
                        <p>agregar usuario</p>
                    </button>
                </div>
            </div>

            <div class="card table-card">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user__content"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="edit-user-modal" class="modal-overlay">
        <form id="edit-user-form" class="card modal-card">
            <h2 id="edit-user-title">Editar usuario</h2>
            <input type="hidden" id="edit-user-id">

            <div class="form-field">
                <label for="edit-user-nombre">Nombre</label>
                <input type="text" id="edit-user-nombre" required>
            </div>

            <div class="form-field">
                <label for="edit-user-correo">Correo</label>
                <input type="email" id="edit-user-correo" required>
            </div>

            <div class="form-field">
                <label for="edit-user-rol">Rol</label>
                <select id="edit-user-rol">
                    <option value="Administrador">Administrador</option>
                    <option value="Cocinero">Cocinero</option>
                    <option value="Repartidor">Repartidor</option>
                </select>
            </div>

            <div class="form-field">
                <label for="edit-user-contrasena">Contraseña</label>
                <input type="text" id="edit-user-contrasena" minlength="6">
            </div>

            <div class="form-field">
                <label for="edit-user-activo">Estado</label>
                <select id="edit-user-activo">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" id="edit-user-cancel" class="button button--white">Cancelar</button>
                <button type="submit" class="button button--blue">Guardar</button>
            </div>
        </form>
    </div>

</body>
</html>
