<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://kit.fontawesome.com/cbd3f1ded0.js" crossorigin="anonymous"></script>
</head>
<body class="flex"></body>
    <div id="menu">
        <div id="menu-logo">
            <img src="/src/Logo/logo_simple.svg" alt="logo">
        </div>
        <p id="rol-name">Cocinero</p>

        <div class="options">
            <a class="option" href="home.html">
                <i class="fa-solid fa-house"></i>

            </a>
            <a class="option" href="PedidosActivos.html">
                <i class="option-icon fa-regular fa-clipboard"></i>

            <a class="option option--active" href="PedidosPendientes.html">

        <section>

                        <span>
                            <div class="product">
